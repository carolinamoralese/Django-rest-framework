<h1>Buscar empleados por palabra clave</h1>
<form method="get" action="{% url 'employee_list_by_keyword' %}">
    <input type="text" id="keyword" name="keyword" placeholder="Ingrese una palabra clave">
    <button type="submit">Buscar</button>
</form>

<h2>Resultados de la búsqueda:</h2>
<ul>
    {% for employee in employees %}
        <li>{{ employee.name }} {{ employee.last_name }}</li>
    {% endfor %}
</ul>
